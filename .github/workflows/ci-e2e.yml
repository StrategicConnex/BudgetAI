# ===== CI/CD: Playwright E2E Pipeline =====
# Ejecuta pruebas de integración de punta a punta en cada PR a main/develop.

name: CI - E2E Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'hooks/**'
      - 'store/**'
      - 'tests/e2e/**'
      - 'tests/config/**'
      - 'tests/fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'postcss.config.js'
      - 'tsconfig.json'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'hooks/**'
      - 'store/**'
      - 'tests/e2e/**'
      - 'tests/config/**'
      - 'tests/fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'middleware.ts'
      - 'next.config.mjs'
      - 'postcss.config.js'
      - 'tsconfig.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      PLAYWRIGHT_TEST: 'true'
      NEXT_PUBLIC_PLAYWRIGHT_TEST: 'true'
      SHARE_TEST_BUDGET_ID: '00000000-0000-0000-0000-000000000002'
      NEXT_PUBLIC_SUPABASE_URL: 'https://test-project.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'test-anon-key'
      SUPABASE_SERVICE_ROLE_KEY: 'test-service-role-key'
      GEMINI_API_KEY: 'test-gemini-key'
      OPENROUTER_API_KEY: 'test-openrouter-key'
      XIAOMI_API_KEY: 'test-xiaomi-key'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies (always needed even if browsers are cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write CI summary
        if: always()
        run: |
          echo '## CI E2E Results' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright E2E Tests | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
